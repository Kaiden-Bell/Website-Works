<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silvers | Premium COD Edits</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="letterbox-top"></div>
    <div class="letterbox-bottom"></div>
    
    <section id="hero">
        <div class="bg-video-placeholder"></div>
        <div class="vignette"></div>
        <div class="hero-content">
            <h1 class="massive-title">SILVERS</h1>
            <p class="subtitle">Premium COD Edits</p>
            <a href="#request" class="cta-btn">Request an Edit</a>
        </div>
    </section>

    <section id="work">
        <div class="work-item">
            <h2 class="work-title">WARZONE EXTINCTION</h2>
        </div>
        <div class="work-item">
            <h2 class="work-title">RANKED ASCENSION</h2>
        </div>
        <div class="work-item">
            <h2 class="work-title">TERMINAL VELOCITY</h2>
        </div>
        <div class="work-item">
            <h2 class="work-title">DARK MATTER</h2>
        </div>
    </section>

    <section id="statement">
        <div class="vignette"></div>
        <h2 class="statement-text" id="statement-content">Premium gaming edits crafted for content creators who refuse to blend in. Every frame is intentional. Every cut hits different.</h2>
    </section>

    <section id="final-cta">
        <div class="vignette"></div>
        <div class="cta-content">
            <h2 class="massive-title">READY?</h2>
            <a href="#request" class="cta-btn">Request an Edit</a>
        </div>
    </section>

    <script>
        // Wrap statement words in span for staggering animation
        const statement = document.getElementById('statement-content');
        const text = statement.innerText;
        statement.innerHTML = '';
        const words = text.split(' ');
        words.forEach((word, index) => {
            const span = document.createElement('span');
            span.classList.add('word');
            span.innerText = word + ' ';
            // Stagger animation delays for each word
            span.style.transitionDelay = `${index * 0.1}s`;
            statement.appendChild(span);
        });

        // Intersection Observer for scroll triggers
        const observerOptions = {
            root: null,
            rootMargin: '0px',
            threshold: 0.5
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('is-visible');
                } else {
                    // Reset animation so it replays when scrolling back
                    entry.target.classList.remove('is-visible');
                }
            });
        }, observerOptions);

        document.querySelectorAll('section').forEach(section => {
            observer.observe(section);
        });
    </script>
</body>
</html>
