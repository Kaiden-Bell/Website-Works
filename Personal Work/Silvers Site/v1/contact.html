<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SILVERS | Contact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .contact-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6rem;
            max-width: 1400px;
            margin: 0 auto;
            padding: 4rem 5% 8rem;
        }

        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #888888;
        }

        .form-input, .form-select, .form-textarea {
            background: transparent;
            border: none;
            border-bottom: 1px solid #333333;
            color: #ffffff;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.1rem;
            padding: 0.75rem 0;
            transition: border-color 0.3s ease;
            width: 100%;
        }
        
        .form-select {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            border-radius: 0;
            cursor: pointer;
        }

        .form-select option {
            background-color: #000000;
            color: #ffffff;
        }

        .form-textarea {
            resize: vertical;
            min-height: 120px;
        }

        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none;
            border-color: #ffffff;
        }

        .submit-btn {
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 1rem 2rem;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            align-self: flex-start;
            margin-top: 1rem;
        }

        .submit-btn:hover {
            background-color: #cccccc;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 3rem;
        }

        .info-block {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .info-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #555555;
        }

        .info-value {
            font-size: 1.5rem;
            color: #ffffff;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .info-value:hover {
            color: #888888;
        }

        @media (max-width: 992px) {
            .contact-layout {
                grid-template-columns: 1fr;
                gap: 4rem;
            }
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav class="nav" id="nav">
        <a href="index.html" class="logo" style="text-decoration:none; color:inherit;">SILVERS</a>
        <div class="nav-links">
            <a href="work.html" class="nav-link">Work</a>
            <a href="about.html" class="nav-link">About</a>
            <a href="services.html" class="nav-link">Services</a>
        </div>
        <div class="nav-end">
            <a href="contact.html" class="cta-link">Request an Edit</a>
        </div>
    </nav>

    <header class="hero scroll-fade">
        <div class="hero-content">
            <h1 class="hero-title">GET IN TOUCH</h1>
            <p class="hero-subtitle">Let's build something that hits</p>
        </div>
    </header>

    <section class="contact-layout scroll-fade">
        <div class="form-container">
            <form class="contact-form" action="mailto:contact@silvers.com" method="post" enctype="text/plain" id="contactForm">
                <div class="form-group">
                    <label class="form-label" for="name">Name</label>
                    <input type="text" id="name" name="Name" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" id="email" name="Email" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="project-type">Project Type</label>
                    <select id="project-type" name="Project Type" class="form-select" required>
                        <option value="" disabled selected>Select a service</option>
                        <option value="Montage">Montage</option>
                        <option value="Fragmovie">Fragmovie</option>
                        <option value="Short Form">Short Form</option>
                        <option value="Motion Graphics">Motion Graphics</option>
                        <option value="Color Grading">Color Grading</option>
                        <option value="Sound Design">Sound Design</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="budget">Budget Range</label>
                    <select id="budget" name="Budget Range" class="form-select" required>
                        <option value="" disabled selected>Select a budget</option>
                        <option value="Under $100">Under $100</option>
                        <option value="$100-$250">$100-$250</option>
                        <option value="$250-$500">$250-$500</option>
                        <option value="$500+">$500+</option>
                        <option value="Let's Discuss">Let's Discuss</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="message">Message</label>
                    <textarea id="message" name="Message" class="form-textarea" required></textarea>
                </div>

                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </div>

        <div class="contact-info">
            <div class="info-block">
                <span class="info-label">Email</span>
                <a href="mailto:contact@silvers.com" class="info-value">contact@silvers.com</a>
            </div>
            
            <div class="info-block">
                <span class="info-label">Discord</span>
                <span class="info-value">SilversFX</span>
            </div>

            <div class="info-block">
                <span class="info-label">YouTube</span>
                <a href="#" class="info-value">@SilversFX</a>
            </div>

            <div class="info-block">
                <span class="info-label">Twitter</span>
                <a href="#" class="info-value">@SilversFX</a>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-inner">
                <span class="footer-logo">SILVERS</span>
                <div class="footer-links">
                    <a href="https://youtube.com/@SilversFX" class="footer-link" target="_blank" rel="noopener">YouTube</a>
                    <a href="https://twitter.com/SilversFX" class="footer-link" target="_blank" rel="noopener">Twitter</a>
                    <a href="https://instagram.com" class="footer-link" target="_blank" rel="noopener">Instagram</a>
                    <a href="https://discord.com" class="footer-link" target="_blank" rel="noopener">Discord</a>
                </div>
                <span class="footer-copy">© 2026 Silvers. All rights reserved.</span>
            </div>
        </div>
    </footer>

    <script>
        // ─── Nav scroll effect ───
        const nav = document.getElementById('nav');
        let lastScroll = 0;

        window.addEventListener('scroll', () => {
            const currentScroll = window.scrollY;
            if (currentScroll > 80) {
                nav.classList.add('scrolled');
            } else {
                nav.classList.remove('scrolled');
            }
            lastScroll = currentScroll;
        }, { passive: true });

        // Scroll fade animations
        const fadeElements = document.querySelectorAll('.scroll-fade');
        
        const fadeObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, {
            threshold: 0.1,
            rootMargin: "0px 0px -50px 0px"
        });

        fadeElements.forEach(element => {
            fadeObserver.observe(element);
        });

        // Basic form validation (optional addition to HTML5 required attrs)
        const form = document.getElementById('contactForm');
        form.addEventListener('submit', (e) => {
            const selects = form.querySelectorAll('select');
            let valid = true;
            selects.forEach(select => {
                if(!select.value) {
                    valid = false;
                }
            });
            if(!valid) {
                e.preventDefault();
                alert('Please fill out all required fields.');
            }
        });
    </script>
</body>
</html>
